[build]
  # Build command for Next.js
  command = "npm run build"
  # Publish directory — Netlify Next.js plugin handles this automatically
  publish = ".next"

# Essential Next.js plugin for SSR/ISR/API routes on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── API Proxy: Route /api/v1/* to Railway backend ────────────────────────────
# These run at the Netlify CDN edge — no CORS, no serverless cold starts.
# The browser calls sssi-crm.netlify.app/api/v1/auth/login
# Netlify proxies it to claritai-edtech-production.up.railway.app/api/v1/auth/login

[[redirects]]
  from = "/api/v1/*"
  to = "https://claritai-edtech-production.up.railway.app/api/v1/:splat"
  status = 200
  force = true
  # Forward all headers (including Authorization)
  [redirects.headers]
    X-Forwarded-Host = "sssi-crm.netlify.app"

# ── Security & Performance Headers ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Environment Variables (also set in Netlify UI) ───────────────────────────
[build.environment]
  NEXT_PUBLIC_API_URL = "https://claritai-edtech-production.up.railway.app"
  NODE_VERSION = "18"
